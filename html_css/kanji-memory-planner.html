<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanji Memory Planner</title>
    <link rel="stylesheet" href="kanji-memory-planner.css" type="text/css" />
  </head>
  <body>
    <section class="card-list">
      <article class="kanji-card">
        <div class="kanji-main">漢</div>
        <div class="overlay">
          <p>뜻: 한자</p>
          <p>음독: カン</p>
          <p>훈독: なし</p>
        </div>
      </article>

      <article class="kanji-card">
        <div class="kanji-main">学</div>
        <div class="overlay">
          <p>뜻: 배우다</p>
          <p>음독: ガク</p>
          <p>훈독: まなぶ</p>
        </div>
      </article>
    </section>
  </body>
</html>

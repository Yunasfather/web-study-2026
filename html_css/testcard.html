<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        max-width: 1000px;
        box-sizing: border-box;
      }
      .card {
        border: 1px solid blue;
        border-radius: 16px;
        margin: 20px;
        width: 80%;
        text-align: center;
      }
      .card-sec {
        border: 1px solid pink;
        border-radius: 12px;
      }
      .word {
      }

      .mean {
        transition: 0.5s ease;
      }

      .word:hover .mean {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>카드 테스트</h2>
      <div class="card-sec">
        <div class="word">한자</div>
        <div class="mean">
          <p>훈독</p>
          <p>음독</p>
        </div>
      </div>
    </div>
  </body>
</html>

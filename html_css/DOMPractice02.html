<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>DOM 이벤트 리스트 연습</title>
  </head>
  <body>
    <h1 id="title">DOM li 추가 연습</h1>
    <ul id="studyList">
      <li>HTML 복습</li>
      <li>CSS 복습</li>
    </ul>

    <button id="addBtn">복습 추가</button>
    <script>
      document.getElementById("addBtn").addEventListener("click", function () {
       
        const studyList = document.getElementById("studyList"); 
        const newItem = document.createElement("li"); 
        newItem.textContent = "DOM 복습 완료"; 
        studyList.appendChild(newItem); 
       
      });
    </script>
  </body>
</html>

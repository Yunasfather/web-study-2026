<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>DOM 이벤트 리스트 연습</title>
  </head>
  <body>
    <h1 id="title">DOM li 추가 연습</h1>
    <ul id="studyList">
      <li>HTML 복습</li>
      <li>CSS 복습</li>
    </ul>

    <button id="addBtn">복습 추가</button>
    <script>
      document.getElementById("addBtn").addEventListener("click", function () {
        // id =addBtn을 가진 버튼에 접근한다, 버튼에 클릭이라는 이벤트가 발생하면 아래의 문들이 작동한다.
        const studyList = document.getElementById("studyList"); // study 변수에 id가 studyList인것을 담는다.
        const newItem = document.createElement("li"); // li를 생성하는 text변수를 만들어 담는다.
        newItem.textContent = "DOM 복습 완료"; // text변수에 DOM 복습 완료를 넣는다.
        studyList.appendChild(newItem); // study변수에 text변수를 추가한다.
      });
    </script>
  </body>
</html>

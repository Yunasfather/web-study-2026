<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 100%;
        max-width: 500px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 20px;
      }

      img {
        width: 100%;
        height: 100px;
        object-fit: cover;
      }
      @media (max-width: 600px) {
        .container {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 400px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img src="image/pexels-bamboo-1283976.jpg" alt="" />
      </div>
      <div class="card">
        <img src="image/shogun-lake-4431134.jpg" alt="" />
      </div>
      <div class="card">
        <img src="image/tieubaotruong-chilli-9202873.jpg" alt="" />
      </div>
      <div class="card">
        <img src="image/valiphotos-road-1072821.jpg" alt="" />
      </div>
      <div class="card"><img src="image/바다.jpg" alt="" /></div>
      <div class="card"><img src="image/언덕1.jpg" alt="" /></div>
    </div>
  </body>
</html>

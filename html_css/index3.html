<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>신상품 카드 UI 연습</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
  </head>
  <body>
    <div class="card-container">
      <div class="product-card">
        <div class="badge">NEW</div>
        <div class="image-box">
          <img src="images/headset.jpg" alt="상품 이미지" />
        </div>
        <div class="info-box">
          <h3 class="product-name">프리미엄 무선 헤드셋 2026</h3>
          <p class="product-price">129,000원</p>
          <button class="buy-btn">장바구니 담기</button>
        </div>
      </div>
    </div>
  </body>
</html>

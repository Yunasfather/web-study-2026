<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 200px;
        height: 200px;
        background-color: gray;
        position: relative;
      }

      .overlay {
        color: white;

        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: blue;

        opacity: 0;
        transition: 0.5s ease;
      }

      .container:hover .overlay {
        opacity: 1;
      }

      p {
        text-align: center;

        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        -webkit-transform: translate(-50%, -50%);
        -ms-transform: translate(-50%, -50%);

        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="overlay">
        <p>안녕하세요</p>
      </div>
    </div>
  </body>
</html>

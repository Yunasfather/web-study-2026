<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>다이나믹 상품 카드</title>
    <style>
      /* 1. 상품 카드 기본 디자인 설정 */
      .box {
        width: 200px;
        height: 250px;
        background-color: #f8f9fa;
        border: 2px solid #ddd;
        border-radius: 10px;

        /* 텍스트를 카드 정중앙에 배치 (미션 2에서 썼던 마법의 코드) */
        display: flex;
        justify-content: center;
        align-items: center;

        /* 2. ★ Transition은 반드시 '기본 상태'에 적어줍니다! */
        /* 그래야 마우스를 뗄 때도 0.5초에 걸쳐 부드럽게 돌아옵니다. */
        transition: 0.5s ease;
      }

      /* 3. 마우스를 올렸을 때의 변화 */
      .box:hover {
        /* ★ 두 가지 변형을 한 줄에 띄어쓰기로 작성합니다! */
        transform: scale(1.2) rotate(15deg);

        /* 살짝 그림자를 주면 붕 떠오르는 입체감이 극대화됩니다 (선택사항) */
        box-shadow: 5px 10px 15px rgba(0, 0, 0, 0.2);
      }

      /* (참고) p 태그의 기본 여백 때문에 카드가 안 예뻐지는 걸 막는 코드 */
      p {
        margin: 0;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p>한정판 운동화</p>
    </div>
  </body>
</html>

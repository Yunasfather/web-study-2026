<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        box-sizing: border-box;
        margin: 0;
      }

      .container {
        display: grid;
        gap: 40px;
        border: 2px solid black;
        width: 300px;
        height: 450px;
        grid-template-columns: 1fr 1fr 1fr;
        text-align: center;
      }

      .card {
        border: 2px solid pink;
        border-radius: 20px;
        margin: 20px;
        position: relative;
        overflow: hidden;
        transition: all 0.9s ease;
      }
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: all 0.9s ease;
        transform: translate(-50%, -50%);
      }

      .card:hover .overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 1;

        background-color: skyblue;
        width: 100%;
        height: 100%;
      }
      .card:hover {
        transform: scale(1.2);
      }

      @media (max-width: 250px) {
        .container {
          grid-template-columns햣 : 1fr 1fr;
        }
      }

      @media (min-width: 100px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h2>한자</h2>
        <div class="overlay">
          <p>뜻</p>
        </div>
      </div>

      <div class="card">
        <h2>한자</h2>
        <div class="overlay">
          <p>뜻</p>
        </div>
      </div>
    </div>
  </body>
</html>

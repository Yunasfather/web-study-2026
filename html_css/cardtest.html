<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardTest</title>
    <style>
      .main-width {
        max-width: 1000px;
        box-sizing: border-box;
      }

      .card {
        color: black;

        width: 100%;
        padding: auto;

        position: relative;

        text-align: center;

        border: 2px solid pink;
        border-radius: 16px;
      }

      .kanji {
        border: 2px solid blue;
        color: black;
        width: 50%;
        margin: 10px 25%;
        border-radius: 16px;
        position: relative;
        height: 160px;
      }
      .mean {
        color: white;
        background-color: blue;
        width: 100%;
        height: 100%;

        transition: 0.5s ease;
        opacity: 0;
        position: absolute;
        top: 0;
        left: 0;

        border-radius: 16px;
      }
      .kanji:hover .mean {
        transform: scale(1, 1.1);
        opacity: 1;
      }
      .card:hover h2 {
        transform: translateY(5px);
        transition: 2s ease-in-out;
      }
      button:hover {
        background-color: pink;
        transition: 2s ease-in;
      }
    </style>
  </head>
  <body>
    <main class="main-width">
      <div class="card">
        <h2>오늘의 한자</h2>
        <div class="kanji">
          <p>한자1</p>

          <div class="mean">
            <p>훈독</p>
            <p>음독</p>
            <p>단어</p>
          </div>
        </div>
      </div>

      <button>버튼</button>
    </main>
  </body>
</html>

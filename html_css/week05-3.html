<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>overlay</title>
    <style>
      .container {
        position: relative;
        width: 50%;
      }
      .image {
        display: block;
        width: 50%;
        height: auto;
      }
      .overlay {
        position: absolute;
        top: 0;

        left: 0;

        height: auto;
        width: 100%;
        opacity: 0;
        transition: 0.5s ease;
      }
      .container:hover .overlay {
        opacity: 1;
      }
      #change {
        position: absolute;
        top: 0;
        left: 0;
        transform: translate(0, 0);
        -webkit-transform: translate(0, 0);
        -ms-transform: translate(0, 0);
      }
    </style>
  </head>
  <body>
    <h2>이미지 오버레이</h2>
    <p>이미지 위에 마우스를 올려 놓으면 효과를 볼 수 있습니다.</p>
    <div class="container">
      <img
        src="image/Gemini_Generated_Image_22lqsi22lqsi22lq.png"
        alt=""
        class="image"
      />
      <div class="overlay">
        <img
          src="image/Gemini_Generated_Image_vswdl6vswdl6vswd.png"
          alt=""
          class="image"
          id="change"
        />
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" type="text/css" />
    <title>Kanji Memory Planner</title>
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <h1 class="app-title">漢字記憶プランナー</h1>
        <p class="app-subtitle">
          エビングハウスの忘却曲線に基づいて、漢字の復習タイミングを管理する学習アプリ
        </p>
      </header>
      <main class="app-main">
        <section class="review-card-section">
          <!-- 뜻: 오늘 복습 카드 전체 영역 -->

          <div class="container">
            <!-- 뜻: section 안의 내용을 감싸는 박스 -->

            <h2 class="section-title">今日の復習カード</h2>
            <!-- 뜻: 이 영역의 제목 -->

            <div class="card-list">
              <!-- 뜻: 여러 개의 한자 카드를 가로/반응형으로 배치할 부모 박스 -->

              <div class="kanji-card">
                <!-- 뜻: 첫 번째 한자 카드 -->

                <p class="kanji-main">첫 번째 한자</p>
                <!-- 뜻: 카드 앞면에 크게 보일 한자 -->

                <div class="overlay">
                  <!-- 뜻: hover 했을 때 카드 위에 덮일 설명 영역 -->

                  <div class="kanji-mean">
                    <!-- 뜻: 의미, 음독, 훈독을 가운데 보여주는 박스 -->

                    <p>의미가 나온 곳</p>
                    <p>음독</p>
                    <p>훈독</p>
                  </div>
                </div>
              </div>

              <div class="kanji-card">
                <!-- 뜻: 두 번째 한자 카드 -->

                <p class="kanji-main">두 번째 한자</p>

                <div class="overlay">
                  <div class="kanji-mean">
                    <p>의미가 나온 곳</p>
                    <p>음독</p>
                    <p>훈독</p>
                  </div>
                </div>
              </div>
            </div>

            <p>次の復習日: <time datetime="2026-05-30">2026-05-30</time></p>

            <input
              class="review-status"
              type="text"
              placeholder="정답 입력칸"
              required
            />

            <button type="button" class="review-button">復習する</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
